<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7c3aed" flood-opacity="0.22" />
    </filter>

    <!-- Máscara animada para digitar a Frase 1 -->
    <clipPath id="clipPhrase1">
      <rect x="28" y="90" width="0" height="35">
        <animate attributeName="width" values="0; 450; 450; 0; 0; 0; 0" keyTimes="0; 0.32; 0.46; 0.50; 0.50; 0.98; 1" dur="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Máscara animada para digitar a Frase 2 -->
    <clipPath id="clipPhrase2">
      <rect x="28" y="90" width="0" height="35">
        <animate attributeName="width" values="0; 0; 0; 0; 470; 470; 0" keyTimes="0; 0.48; 0.50; 0.50; 0.82; 0.96; 1" dur="8s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <!-- Janela Principal -->
  <rect x="2" y="2" width="796" height="656" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)" />

  <!-- Barra macOS -->
  <path d="M 2 12 Q 2 2 12 2 L 788 2 Q 798 2 798 12 L 798 36 L 2 36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="798" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Bolinhas macOS -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <text x="400" y="23" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace">
    vinicius@workstation: ~ (zsh)
  </text>

  <!-- Linha de Prompt -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="13">
    <text x="28" y="66">
      <tspan fill="#3fb950" font-weight="600">vinicius@developer</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#8b949e">$ </tspan>
      <tspan fill="#e6edf3">neofetch --full-profile</tspan>
    </text>
  </g>
  <line x1="28" y1="78" x2="770" y2="78" stroke="#21262d" stroke-width="1" />

  <!-- Digitação Letra por Letra Frase 1 -->
