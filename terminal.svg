<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c3aed" flood-opacity="0.2" />
    </filter>

    <!-- Path animado que digita letra por letra a frase 1 -->
    <path id="typePath1">
      <animate id="anim1" attributeName="d" begin="0s;anim2.end+0.5s" dur="4s" fill="remove"
        values="m 28,112 h 0 ; m 28,112 h 650 ; m 28,112 h 650 ; m 28,112 h 0"
        keyTimes="0;0.5;0.85;1" />
    </path>

    <!-- Path animado que digita letra por letra a frase 2 -->
    <path id="typePath2">
      <animate id="anim2" attributeName="d" begin="anim1.end+0.5s" dur="4.5s" fill="remove"
        values="m 28,112 h 0 ; m 28,112 h 650 ; m 28,112 h 650 ; m 28,112 h 0"
        keyTimes="0;0.5;0.85;1" />
    </path>
  </defs>

  <!-- Janela Principal -->
  <rect x="2" y="2" width="796" height="276" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)" />

  <!-- Barra macOS -->
  <path d="M 2 12 Q 2 2 12 2 L 788 2 Q 798 2 798 12 L 798 36 L 2 36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="798" y2="36" stroke="#30363d" stroke-width="1" />

  <!-- Bolinhas macOS -->
  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <text x="400" y="23" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace">
    vinicius@workstation: ~ (zsh)
  </text>

  <!-- Prompt -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="13">
    <text x="28" y="66">
      <tspan fill="#3fb950" font-weight="600">vinicius@developer</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#8b949e">$ </tspan>
      <tspan fill="#e6edf3">neofetch --profile</tspan>
    </text>
  </g>
  <line x1="28" y1="78" x2="770" y2="78" stroke="#21262d" stroke-width="1" />

  <!-- Digitação animada letra por letra estilo máquina de escrever -->
  <text font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="600" fill="#a78bfa">
    <textPath xlink:href="#typePath1">
      &gt; Mastering React, Next.js and TypeScript
    </textPath>
  </text>

  <text font-family="'Fira Code', Consolas, monospace" font-size="15" font-weight="600" fill="#a78bfa">
    <textPath xlink:href="#typePath2">
      &gt; Full-Stack Developer | Soluções para clientes reais
    </textPath>
  </text>

  <!-- Cursor piscando -->
  <rect x="660" y="98" width="8" height="17" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
  </rect>

  <!-- Card Interno de Informações -->
  <rect x="28" y="130" width="744" height="106" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <g font-family="'Fira Code', Consolas, monospace" font-size="12">
    <text x="44" y="162">
      <tspan fill="#a78bfa" font-weight="600">STACK:</tspan>
      <tspan fill="#e6edf3"> React | Next.js | TypeScript | Node.js | Spring Boot</tspan>
    </text>
    <text x="44" y="202">
      <tspan fill="#a78bfa" font-weight="600">LOCAL:</tspan>
      <tspan fill="#e6edf3"> São José dos Campos, SP</tspan>
    </text>

    <text x="430" y="162">
      <tspan fill="#a78bfa" font-weight="600">CLIENTES:</tspan>
      <tspan fill="#e6edf3"> GSW Soluções Integradas, Newe Log</tspan>
    </text>
    <circle cx="436" cy="199" r="4" fill="#2ea043" />
    <text x="448" y="202">
      <tspan fill="#a78bfa" font-weight="600">STATUS:</tspan>
      <tspan fill="#3fb950" font-weight="500"> Disponível para novas oportunidades</tspan>
    </text>
  </g>
</svg>
