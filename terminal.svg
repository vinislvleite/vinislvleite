<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7c3aed" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect x="2" y="2" width="796" height="296" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2" filter="url(#shadow)" />

  <!-- Barra macOS -->
  <path d="M 2 12 Q 2 2 12 2 L 788 2 Q 798 2 798 12 L 798 36 L 2 36 Z" fill="#161b22" />
  <line x1="2" y1="36" x2="798" y2="36" stroke="#30363d" stroke-width="1" />

  <circle cx="22" cy="19" r="5" fill="#ff5f56" />
  <circle cx="38" cy="19" r="5" fill="#ffbd2e" />
  <circle cx="54" cy="19" r="5" fill="#27c93f" />

  <text x="400" y="23" text-anchor="middle" fill="#8b949e" font-size="11.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace">
    vinicius@workstation: ~ (zsh)
  </text>

  <!-- Prompt -->
  <g font-family="'Fira Code', Consolas, monospace" font-size="13">
    <text x="28" y="66">
      <tspan fill="#3fb950" font-weight="600">vinicius@developer</tspan>
      <tspan fill="#8b949e">:</tspan>
      <tspan fill="#58a6ff">~</tspan>
      <tspan fill="#8b949e">$ </tspan>
      <tspan fill="#e6edf3">neofetch --profile</tspan>
    </text>
  </g>
  <line x1="28" y1="78" x2="770" y2="78" stroke="#21262d" stroke-width="1" />

  <text x="28" y="110" font-family="'Fira Code', Consolas, monospace" font-size="14.5" font-weight="600" fill="#a78bfa">
    <tspan>&gt; Full-Stack Developer | Foco em Front-End Moderno</tspan>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.46;0.5;0.96;1" dur="7s" repeatCount="indefinite" />
  </text>

  <text x="28" y="110" font-family="'Fira Code', Consolas, monospace" font-size="14.5" font-weight="600" fill="#a78bfa">
    <tspan>&gt; Aplicações web escaláveis desenvolvidas para clientes reais</tspan>
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.54;0.96;1" dur="7s" repeatCount="indefinite" />
  </text>

  <rect x="635" y="97" width="8" height="16" fill="#ffffff">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
  </rect>

  <rect x="28" y="128" width="744" height="96" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <g font-family="'Fira Code', Consolas, monospace" font-size="12">
    <text x="44" y="158">
      <tspan fill="#a78bfa" font-weight="600">STACK:</tspan>
      <tspan fill="#e6edf3"> React • Next.js • TypeScript • Node.js • Spring Boot</tspan>
    </text>
    <text x="44" y="196">
      <tspan fill="#a78bfa" font-weight="600">LOCAL:</tspan>
      <tspan fill="#e6edf3"> São José dos Campos, SP</tspan>
    </text>

    <text x="430" y="158">
      <tspan fill="#a78bfa" font-weight="600">CLIENTES:</tspan>
      <tspan fill="#e6edf3"> Projetos em produção para empresas ativas</tspan>
    </text>
    <circle cx="436" cy="193" r="4" fill="#2ea043" />
    <text x="448" y="196">
      <tspan fill="#a78bfa" font-weight="600">STATUS:</tspan>
      <tspan fill="#3fb950" font-weight="500"> Disponível para contratação</tspan>
    </text>
  </g>

  <rect x="28" y="240" width="140" height="30" rx="4" fill="#7c3aed" />
  <text x="98" y="259" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">
    LinkedIn
  </text>

  <rect x="180" y="240" width="190" height="30" rx="4" fill="#21262d" stroke="#30363d" />
  <text x="275" y="259" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
    Graduação em Andamento
  </text>

  <rect x="382" y="240" width="190" height="30" rx="4" fill="#21262d" stroke="#30363d" />
  <text x="477" y="259" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
    Projetos em Produção
  </text>
</svg>
