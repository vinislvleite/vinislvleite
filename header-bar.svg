<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 44" width="100%" height="44">
  <defs>
    <linearGradient id="headerGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120624" />
      <stop offset="100%" stop-color="#07030d" />
    </linearGradient>
    <linearGradient id="headerBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.20" />
    </linearGradient>
    <linearGradient id="pillGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Header Bar with Top Rounded Corners -->
  <path d="M 12 43 L 12 18 Q 12 2 28 2 L 792 2 Q 808 2 808 18 L 808 43 Z" fill="url(#headerGlass)" stroke="url(#headerBorder)" stroke-width="1.2" />
  <line x1="28" y1="3" x2="792" y2="3" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.8" />
  <line x1="12" y1="43" x2="808" y2="43" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1" />

  <!-- macOS Window Dots (Apple Traffic Lights) -->
  <g transform="translate(34, 15)">
    <!-- Close (Red) -->
    <circle cx="7" cy="7" r="6.2" fill="#ff5f57" />
    <circle cx="7" cy="5.2" r="4.5" fill="#ffffff" fill-opacity="0.25" />
    <!-- Minimize (Yellow) -->
    <circle cx="27" cy="7" r="6.2" fill="#febc2e" />
    <circle cx="27" cy="5.2" r="4.5" fill="#ffffff" fill-opacity="0.25" />
    <!-- Fullscreen (Green) -->
    <circle cx="47" cy="7" r="6.2" fill="#28c840" />
    <circle cx="47" cy="5.2" r="4.5" fill="#ffffff" fill-opacity="0.25" />
  </g>

  <!-- Title Bar Pill -->
  <g transform="translate(290, 10)">
    <rect width="240" height="24" rx="12" fill="url(#pillGlass)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.8" />
    <text x="120" y="16.5" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.3">vinicius@workstation: ~ (zsh)</text>
  </g>
</svg>