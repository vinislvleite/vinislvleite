<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 155" width="100%" height="100%" style="cursor: default; user-select: none;">
  <style>
    text, tspan { font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
  </style>
    <defs>
    <filter id="cleanShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="windowGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07030d" />
      <stop offset="40%" stop-color="#120620" />
      <stop offset="100%" stop-color="#220b3b" />
    </linearGradient>
    <linearGradient id="liquidGlassBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="20%" stop-color="#c4b5fd" stop-opacity="0.22" />
      <stop offset="65%" stop-color="#7c3aed" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="headerGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="cardGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="30%" stop-color="#c4b5fd" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="pillGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="pillBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#c4b5fd" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="dividerFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.50" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Frame segment -->
  <rect x="10" y="0" width="800" height="155" fill="url(#windowGlass)" stroke="url(#liquidGlassBorder)" stroke-width="1.6" />

  <!-- Stats Card -->
  <rect x="30" y="8" width="760" height="138" rx="14" fill="url(#cardGlass)" stroke="url(#cardBorder)" stroke-width="1" />
  <line x1="42" y1="9" x2="778" y2="9" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8" />
  <text x="48" y="32" font-size="13" font-weight="600" letter-spacing="0.5" fill="#d8b4fe">&gt; [ 03. CONTRIBUTION STATISTICS ]</text>

  <line x1="284" y1="42" x2="284" y2="136" stroke="url(#dividerFade)" stroke-width="1.2" />
  <line x1="536" y1="42" x2="536" y2="136" stroke="url(#dividerFade)" stroke-width="1.2" />

  <!-- Total Contributions -->
  <g text-anchor="middle">
    <text x="167" y="78" font-size="34" font-weight="700" fill="#f87171" letter-spacing="-0.5">466</text>
    <text x="167" y="104" font-size="12" font-weight="500" fill="#f472b6">Total Contributions</text>
    <text x="167" y="126" font-size="11" fill="#94a3b8">Mar 13, 2024 - Present</text>
  </g>

  <!-- Current Streak -->
  <g text-anchor="middle">
    <circle cx="410" cy="70" r="26" fill="none" stroke="#7c3aed" stroke-width="3.5" />
    <path d="M 410 36 C 405 43 402 47 402 52 C 402 57 405 60 410 60 C 415 60 418 57 418 52 C 418 47 415 43 410 36 Z" fill="#c4b5fd" />
    <path d="M 410 44 C 407 48 406 50 406 53 C 406 55 407 57 410 57 C 413 57 414 55 414 53 C 414 50 413 48 410 44 Z" fill="#60a5fa" />
    <text x="410" y="78" font-size="24" font-weight="700" fill="#60a5fa">0</text>
    <text x="410" y="108" font-size="12.5" font-weight="600" fill="#ffffff">Current Streak</text>
    <text x="410" y="128" font-size="11" fill="#94a3b8">Nov 7</text>
  </g>

  <!-- Longest Streak -->
  <g text-anchor="middle">
    <text x="648" y="78" font-size="34" font-weight="700" fill="#f87171" letter-spacing="-0.5">8</text>
    <text x="648" y="104" font-size="12" font-weight="500" fill="#f472b6">Longest Streak</text>
    <text x="648" y="126" font-size="11" fill="#94a3b8">Oct 19 - Oct 26</text>
  </g>
</svg>