<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 42" width="200" height="42">
  <defs>
    <linearGradient id="liBtnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1b3a" />
      <stop offset="100%" stop-color="#142857" />
    </linearGradient>
    <linearGradient id="liBtnBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.65" />
    </linearGradient>
    <filter id="liBtnShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.40" />
    </filter>
  </defs>

  <!-- Button Box -->
  <rect x="2" y="2" width="196" height="38" rx="10" fill="url(#liBtnBg)" stroke="url(#liBtnBorder)" stroke-width="1.2" filter="url(#liBtnShadow)" />
  <line x1="12" y1="3" x2="188" y2="3" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.8" />

  <!-- LinkedIn 'in' Icon -->
  <g transform="translate(14, 11)">
    <rect width="20" height="20" rx="4" fill="#0077b5" />
    <text x="10" y="15" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">in</text>
  </g>

  <!-- Button Label -->
  <text x="44" y="25" font-family="'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" fill="#f1f5f9" letter-spacing="0.2">
    LinkedIn Profile <tspan fill="#38bdf8" font-weight="700">&#8599;</tspan>
  </text>
</svg>